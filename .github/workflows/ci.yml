name: CI

on:
  push:
    branches: ["**"]
  pull_request:
  workflow_dispatch:

jobs:
  test:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Validate demo story
        run: python cli/gse.py validate stories/demo/demo.gse

      - name: Self-test (demo + editor REST round-trip)
        run: python cli/gse.py selftest

      - name: Unit tests
        run: python -m unittest discover -s tests -v

      - name: Compile demo game
        run: python cli/gse.py build stories/demo/demo.gse

      - name: Package portable studio
        run: python tools/package.py

      - uses: actions/upload-artifact@v4
        with:
          name: studio-${{ matrix.os }}
          path: dist/
          if-no-files-found: error